name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy a preview channel
    # Pull requests from forks get no OIDC token and must never reach the deploy credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      PUBLIC_DEMO_AGENT_TOKEN: ${{ vars.PUBLIC_DEMO_AGENT_TOKEN }}
      PUBLIC_CONTACT_FORM_ENABLED: ${{ vars.PUBLIC_CONTACT_FORM_ENABLED }}
      CHANNEL_ID: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::notice title=Preview skipped::Set the GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID repository variables to enable previews."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.config.outputs.enabled == 'true'
        run: npm ci

      - if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          create_credentials_file: true

      # The docs go first, so the marketing preview can link to the docs preview instead of production.
      - name: Build and deploy the docs preview channel
        id: docs
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm run build:docs
          npx --yes firebase-tools@15.30.0 hosting:channel:deploy "$CHANNEL_ID" --only docs \
            --project "$FIREBASE_PROJECT_ID" --expires 7d --json > docs-channel.json
          url=$(node -e "const r=require('./docs-channel.json').result; console.log(Object.values(r)[0].url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and deploy the website preview channel
        id: website
        if: steps.config.outputs.enabled == 'true'
        env:
          PUBLIC_DOCS_URL: ${{ steps.docs.outputs.url }}
        run: |
          npm run build:site
          npm run check:csp
          npx --yes firebase-tools@15.30.0 hosting:channel:deploy "$CHANNEL_ID" --only website \
            --project "$FIREBASE_PROJECT_ID" --expires 7d --json > channel.json
          url=$(node -e "const r=require('./channel.json').result; console.log(Object.values(r)[0].url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URLs
        if: steps.config.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.website.outputs.url }}
          DOCS_PREVIEW_URL: ${{ steps.docs.outputs.url }}
        with:
          script: |
            const marker = '<!-- firebase-preview -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}\nDocs preview: ${process.env.DOCS_PREVIEW_URL}\n\nExpires in 7 days. Rebuilt on every push to this pull request.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
